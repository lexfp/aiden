[package]
name = "game"
version = "0.1.0"
authors = ["Aiden"]
edition = "2021"

[dependencies]
sim = { path = "../sim" }
network = { path = "../network" }
math = { path = "../math" }
# `glow` in addition to the defaults: the boarding mode renders its 3D viewport
# through an egui_glow paint callback, so the app runs on the glow backend
# (selected via NativeOptions::renderer in lib.rs).
eframe = { version = "0.35", features = ["glow"] }
log = "0.4"
testkit = { path = "../testkit", optional = true }
tiny_http = { version = "0.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["agent"]
agent = ["dep:tiny_http", "dep:serde", "dep:serde_json", "dep:testkit"]

[dev-dependencies]
# ureq (with json) is used by game's own tests (Task 8); testkit/http gives the
# tests access to testkit::HttpEnv (Task 13) without ureq entering the shipped
# binary. serde_json is a dev-dep too so tests can build JSON regardless of the
# (already-enabled-by-default) agent feature.
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
# testkit/http gives game's own tests access to testkit::HttpEnv (Task 13)
# without ureq entering the shipped binary. Enabled now that Task 9 has added
# testkit's `http` feature.
testkit = { path = "../testkit", features = ["http"] }
egui_kittest = { version = "0.35", features = ["eframe", "wgpu", "snapshot"] }
# egui is pulled transitively (via eframe/egui_kittest); named directly so the
# ui.rs harness can reference `egui::accesskit::Role` for role-based queries
# (login TextEdits are not addressable by hint_text label — see ui.rs).
egui = "0.35"
