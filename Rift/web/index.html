<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rift — Fleet Battles</title>
  <meta name="description" content="Rift: a spaceship fleet-battle game for your phone. Build a fleet, climb the ranks, take the galaxy.">
  <meta name="theme-color" content="#08080A">

  <!-- Installable web app -->
  <link data-trunk rel="copy-file" href="assets/manifest.webmanifest">
  <link data-trunk rel="copy-file" href="assets/sw.js">
  <link data-trunk rel="copy-file" href="assets/icon-192.png">
  <link data-trunk rel="copy-file" href="assets/icon-512.png">
  <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- iPhone: Add to Home Screen -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rift">

  <!-- The game itself -->
  <link data-trunk rel="rust" data-bin="rift-web">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08080A;
      overscroll-behavior: none;
      position: fixed; /* stop iOS Safari rubber-banding the page */
      inset: 0;
    }

    #rift_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none; /* the game handles all gestures */
      outline: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #DAD2BC;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.3em;
      font-size: 0.8rem;
      background: #08080A;
      z-index: 10;
    }

    #loading .bolt {
      width: 64px;
      height: 64px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="rift_canvas"></canvas>
  <div id="loading">
    <svg class="bolt" viewBox="0 0 64 64"><path d="M40 12 L26 32 L36 32 L24 52 L46 28 L34 28 Z" fill="#C41A1A"/></svg>
    LOADING RIFT
  </div>

  <script>
    // Mobile-only gate (same pattern as the studio site's assets/mobile-only.js,
    // inlined because /play/ is served standalone): Rift is a phone game, so
    // desktop visitors get a notice instead of the game.
    (function () {
      'use strict';
      function isMobile() {
        // UA string first: it is definitive when it names a mobile OS, and
        // client hints (userAgentData.mobile) are false on some tablets.
        if (/Android|iPhone|iPad|iPod|webOS|Mobile|Silk/i.test(navigator.userAgent)) return true;
        if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
          return navigator.userAgentData.mobile;
        }
        if (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1) return true;
        return matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0;
      }
      if (isMobile()) return;
      var style = document.createElement('style');
      style.textContent =
        'body > :not(.mobile-gate) { display: none !important; }' +
        '.mobile-gate { position: fixed; inset: 0; z-index: 99999; display: flex;' +
        '  flex-direction: column; align-items: center; justify-content: center;' +
        '  gap: 1rem; padding: 2rem; text-align: center; background: #08080A;' +
        '  color: #DAD2BC; font-family: "Courier New", monospace; }' +
        '.mobile-gate .emoji { font-size: 4rem; }' +
        '.mobile-gate h1 { font-size: 1.4rem; margin: 0; letter-spacing: 0.15em; }' +
        '.mobile-gate p { max-width: 34rem; margin: 0; color: #7A7260; line-height: 1.6; }' +
        '.mobile-gate a { color: #E52A2A; }';
      document.head.appendChild(style);
      function showGate() {
        var gate = document.createElement('div');
        gate.className = 'mobile-gate';
        gate.innerHTML =
          '<div class="emoji">📱</div>' +
          '<h1>RIFT IS A MOBILE GAME</h1>' +
          '<p>Open this page on your Android or iPhone to play — then add it to your home screen to install it.</p>' +
          '<p><a href="../">← Back</a></p>';
        document.body.appendChild(gate);
      }
      if (document.body) showGate();
      else document.addEventListener('DOMContentLoaded', showGate);
    })();

    // Hide the loader once the wasm app has taken over the canvas.
    window.addEventListener('TrunkApplicationStarted', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });

    // Offline support + installability.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
